[package]
name = "salarytool_ios"
version = "0.2.0"
description = "当月薪水到手计算器（iOS）"
authors = ["you"]
edition = "2024"

[lib]
# iOS 上 Tauri 以静态库形式链接进 App，必须有 staticlib
name = "salarytool_ios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
