name: Build iOS

# iOS 只能由 macOS 上的 Xcode 编译，所以用 GitHub 的 macOS runner。
#
# 产出是**未签名**的 .ipa —— CI 上没有开发者证书。在 Windows 上用 Sideloadly
# 之类的工具自签后装到 iPhone。免费 Apple ID 签的 App 每 7 天过期，重签一次即可。
on:
  workflow_dispatch:        # 手动触发：Actions 页面点 Run workflow
  push:
    tags: ["v*"]            # 打 tag 时自动构建

jobs:
  build:
    # 可选标签（截至 2026-11，见 actions/runner-images）：
    #   macos-15 / macos-26 / macos-latest → arm64
    #   macos-15-intel / macos-26-intel    → x64
    # macos-13 已下线，macos-14 已废弃。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # Xcode 的 "Build Rust Code" 脚本阶段会调用 cargo。
      # 它继承的是当前 step 的环境变量，而 rustup 装的 cargo 在 ~/.cargo/bin，
      # 默认不在 PATH 里 —— 上一次构建就是卡在这里（PhaseScriptExecution 失败）。
      - name: 把 cargo 加入 PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/src-tauri -> target

      - name: 安装 CocoaPods
        run: |
          brew install cocoapods
          pod --version

      - name: 安装前端依赖
        working-directory: ios
        run: npm ci

      - name: 生成 iOS 工程骨架
        working-directory: ios
        # 首次运行会生成 src-tauri/gen/apple/，之后请把这个目录提交回仓库，
        # 否则每次 CI 都要重新生成（慢，而且会产生随机 diff）
        run: npx tauri ios init --ci

      - name: 构建前端
        working-directory: ios
        run: npm run build

      # 先把 Rust 静态库单独编出来：这一步失败的话错误信息比 Xcode 脚本阶段清楚得多
      - name: 预编译 Rust 静态库（iOS）
        working-directory: ios/src-tauri
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --lib --release --target aarch64-apple-ios
          ls -lh target/aarch64-apple-ios/release/*.a

      - name: 列出 scheme
        id: scheme
        working-directory: ios/src-tauri/gen/apple
        run: |
          set -euo pipefail
          echo "=== 目录 ==="
          ls -la
          echo "=== project / workspace ==="
          find . -maxdepth 2 \( -name "*.xcworkspace" -o -name "*.xcodeproj" \) | sort
          SCHEME=$(xcodebuild -project salarytool_ios.xcodeproj -list 2>/dev/null \
            | sed -n '/Schemes:/,$p' | tail -n +2 | head -1 | xargs)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "选中的 scheme: $SCHEME"

      # 用 build 而不是 archive：不需要 .xcarchive，直接拿 .app 更省事，
      # 也少一层签名/归档校验。
      - name: 编译 App（关闭签名）
        working-directory: ios/src-tauri/gen/apple
        env:
          SCHEME: ${{ steps.scheme.outputs.scheme }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          xcodebuild \
            -project salarytool_ios.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 打包成未签名 ipa
        working-directory: ios/src-tauri/gen/apple
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "没找到 .app，下面是 Products 目录："
            find build/Build/Products -maxdepth 3 | head -40
            exit 1
          fi
          echo "APP=$APP"
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/SalaryTool-unsigned.ipa Payload
          ls -lh out/SalaryTool-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SalaryTool-unsigned-ipa
          path: ios/src-tauri/gen/apple/out/SalaryTool-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
