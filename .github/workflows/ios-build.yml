name: Build iOS

# iOS 只能由 macOS 上的 Xcode 编译，所以用 GitHub 的 macOS runner。
#
# 产出是**未签名**的 .ipa —— CI 上没有开发者证书。在 Windows 上用 Sideloadly
# 之类的工具自签后装到 iPhone。免费 Apple ID 签的 App 每 7 天过期，重签一次即可。
on:
  workflow_dispatch:        # 手动触发：Actions 页面点 Run workflow
  push:
    tags: ["v*"]            # 打 tag 时自动构建

jobs:
  build:
    # 可选的 macOS runner（截至 2026-11，见 actions/runner-images）：
    #   macos-15 / macos-26 / macos-latest  → arm64，当前主力
    #   macos-15-intel / macos-26-intel     → x64
    #   macos-14                            → 已废弃，macos-13 已下线
    # 之前用 macos-14 报的 "macos-14-arm64-us-default is not supported"
    # 是镜像调度问题：该标签在这类账号上解析到了不可用的配置。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/src-tauri -> target

      - name: 安装 CocoaPods
        run: |
          brew install cocoapods
          pod --version

      - name: 安装前端依赖
        working-directory: ios
        run: npm ci

      - name: 生成 iOS 工程骨架
        working-directory: ios
        # 首次运行会生成 src-tauri/gen/apple/，之后请把这个目录提交回仓库，
        # 否则每次 CI 都要重新生成（慢，而且会产生随机 diff）
        run: npx tauri ios init --ci

      - name: 构建前端
        working-directory: ios
        run: npm run build

      - name: 列出 Xcode scheme
        id: scheme
        working-directory: ios/src-tauri/gen/apple
        run: |
          set -euo pipefail
          echo "=== 目录内容 ==="
          ls -la
          echo "=== 可用的 workspace / project ==="
          find . -maxdepth 2 -name "*.xcworkspace" -o -maxdepth 2 -name "*.xcodeproj" | sort
          # 找到 workspace 里的 scheme 名
          WS=$(find . -maxdepth 2 -name "*.xcworkspace" | head -1)
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          SCHEME=$(xcodebuild -workspace "$WS" -list 2>/dev/null \
            | sed -n '/Schemes:/,$p' | tail -n +2 | head -1 | xargs)
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "选中的 scheme: $SCHEME"

      - name: 编译（关闭签名）
        working-directory: ios/src-tauri/gen/apple
        env:
          WS: ${{ steps.scheme.outputs.workspace }}
          SCHEME: ${{ steps.scheme.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive

      - name: 打包成未签名 ipa
        working-directory: ios/src-tauri/gen/apple
        run: |
          set -euo pipefail
          APP=$(find build -name "*.app" -type d -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP" ]; then
            echo "没找到 .app，下面是 build 目录结构："
            find build -maxdepth 5 -type d | head -40
            exit 1
          fi
          echo "APP=$APP"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SalaryTool-unsigned.ipa Payload
          ls -lh SalaryTool-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SalaryTool-unsigned-ipa
          path: ios/src-tauri/gen/apple/SalaryTool-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
