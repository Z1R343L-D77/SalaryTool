name: Build iOS

# iOS 只能由 macOS 上的 Xcode 编译，所以用 GitHub 的 macOS runner。
#
# 产出是**未签名**的 .ipa —— CI 上没有开发者证书。在 Windows 上用 Sideloadly
# 之类工具自签后装到 iPhone。免费 Apple ID 签的 App 每 7 天过期，重签一次即可。
on:
  workflow_dispatch:        # 手动触发：Actions 页面点 Run workflow
  push:
    tags: ["v*"]            # 打 tag 时自动构建

jobs:
  build:
    # 可选标签（截至 2026-11，见 actions/runner-images）：
    #   macos-15 / macos-26 / macos-latest → arm64
    #   macos-15-intel / macos-26-intel    → x64
    # macos-13 已下线，macos-14 已废弃。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # Xcode 的脚本阶段调用 cargo，需要 ~/.cargo/bin 在 PATH 上
      - name: 把 cargo 加入 PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/src-tauri -> target

      - name: 安装 CocoaPods
        run: |
          brew install cocoapods
          pod --version

      - name: 安装前端依赖
        working-directory: ios
        run: npm ci

      - name: 生成 iOS 工程骨架
        working-directory: ios
        # 首次生成后请把 src-tauri/gen/apple/ 提交回仓库，之后这步可跳过
        run: npx tauri ios init --ci

      # ------------------------------------------------------------------
      # 关键说明：为什么必须用 `tauri ios build` 而不是直接 xcodebuild
      #
      # Tauri 生成的 Xcode 工程里有一个 "Build Rust Code" 脚本阶段，它内部执行的是
      #   npx tauri ios xcode-script ...
      # 而这个子命令需要读取 gen/apple/.tauri/cli-options-server.json ——
      # 那个文件由**父进程** `tauri ios build` 在构建期间创建。
      #
      # 所以我们直接调 xcodebuild 必然失败：
      #   failed to read .../.tauri/cli-options-server.json:
      #   the `tauri ios dev` or `tauri ios build` command must be running
      #
      # 正确做法：让 Tauri 自己驱动 xcodebuild。代价是最后一步「导出 ipa」会
      # 因为缺少签名证书而失败 —— 但那时 .app 已经编译好了，
      # 我们手动把那个 .app 打成 ipa 即可（unzip/zip 结构本来就是 Payload/App.app）。
      # ------------------------------------------------------------------
      - name: 编译（Tauri 驱动，容忍最后的签名导出失败）
        id: build
        working-directory: ios
        run: |
          set +e
          npx tauri ios build --debug --target aarch64 --ci 2>&1 | tee /tmp/ios-build.log
          STATUS=${PIPESTATUS[0]}
          echo "tauri ios build 退出码: $STATUS"

          APP=$(find src-tauri/gen/apple/build -name "*.app" -type d -path "*iphoneos*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没有产出 .app —— 构建在编译阶段就失败了，看上面的日志"
            tail -60 /tmp/ios-build.log
            exit 1
          fi
          echo "找到 .app: $APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: 检查产物
        working-directory: ios
        run: |
          set -euo pipefail
          echo "=== .app 结构 ==="
          ls -la "$APP"
          echo "=== Bundle ID / 版本 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          echo "=== 可执行文件 ==="
          file "$APP"/SalaryTool 2>/dev/null || file "$APP"/*

      - name: 打包成未签名 ipa
        working-directory: ios
        run: |
          set -euo pipefail
          rm -rf Payload out && mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qry out/SalaryTool-unsigned.ipa Payload
          ls -lh out/SalaryTool-unsigned.ipa
          echo "IPA=ios/out/SalaryTool-unsigned.ipa" >> "$GITHUB_ENV"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SalaryTool-unsigned-ipa
          path: ios/out/SalaryTool-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 上传构建日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: /tmp/ios-build.log
          retention-days: 7
          if-no-files-found: ignore
