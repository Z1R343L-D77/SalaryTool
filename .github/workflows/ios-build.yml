name: Build iOS

# iOS 只能由 macOS 上的 Xcode 编译，所以用 GitHub 的 macOS runner。
# 产出是**未签名**的 .ipa，在 Windows 上用 Sideloadly 之类工具自签后装到 iPhone。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ios/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # Xcode 的 Build Rust Code 脚本阶段调用 cargo，需要它在 PATH 上
      - name: cargo PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ios/src-tauri -> target

      - name: CocoaPods
        run: brew install cocoapods

      - name: npm ci
        working-directory: ios
        run: npm ci

      - name: tauri ios init
        working-directory: ios
        run: npx tauri ios init --ci

      # ------------------------------------------------------------------
      # 关键一步：关闭代码签名
      #
      # `tauri ios build` 会让 xcodebuild 在编译阶段就检查签名身份，
      # CI 上没有证书 → "Signing requires a development team" → 失败。
      # Tauri CLI 没有暴露「跳过签名」的开关，但它生成的是标准 Xcode 工程，
      # 所以直接改 project.pbxproj 的 buildSettings 即可。
      #
      # 为什么不能绕开 `tauri ios build` 直接调 xcodebuild：
      # 工程里的 "Build Rust Code" 脚本会执行 `tauri ios xcode-script`，
      # 该子命令要从 gen/apple/.tauri/cli-options-server.json 读选项 ——
      # 那个文件只由父进程 `tauri ios build` 在构建期间创建。
      # 没有父进程就必然报 "command must be running"。
      # ------------------------------------------------------------------
      - name: 关闭 Xcode 代码签名
        working-directory: ios/src-tauri/gen/apple
        run: |
          python3 - <<'PY'
          import re, pathlib

          pbx = pathlib.Path("salarytool_ios.xcodeproj/project.pbxproj")
          text = pbx.read_text()

          # 每个 target 的每个 build configuration 都有 buildSettings = {...}
          # 在开头注入关闭签名的三项。Pods 等子工程同样适用，无害。
          inject = (
              "\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;"
              "\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;"
              "\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";"
              "\n\t\t\t\tDEVELOPMENT_TEAM = \"\";"
              "\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"\";"
              # 关掉 debug dylib：那是 Xcode 的「可调试模式」，会额外产出
              # SalaryTool.debug.dylib（80 MB）并把主二进制变成加载器。
              # 真机上没有调试会话时它启动不了，而且包体积翻 5 倍。
              "\n\t\t\t\tENABLE_DEBUG_DYLIB = NO;"
          )

          count = text.count("buildSettings = {")
          text = text.replace("buildSettings = {", "buildSettings = {" + inject)

          # 如果工程里带了 CODE_SIGN_STYLE = Automatic，改 Manual 免得 Xcode 再要团队
          text = text.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")

          pbx.write_text(text)
          print(f"patched {count} buildSettings blocks")
          PY
          grep -c "CODE_SIGNING_ALLOWED = NO" salarytool_ios.xcodeproj/project.pbxproj

      - name: 构建前端
        working-directory: ios
        run: npm run build

      # Tauri 驱动 Xcode。最后一步导出 ipa 会因为没签名失败，
      # 但那之前 .app 已经编译完成 —— 我们容忍退出码，只检查产物。
      - name: tauri ios build
        id: build
        working-directory: ios
        run: |
          set +e
          npx tauri ios build --target aarch64 --ci 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
          STATUS=${PIPESTATUS[0]}
          echo "tauri ios build 退出码: $STATUS"

          APP=$(find src-tauri/gen/apple "$HOME/Library/Developer/Xcode/DerivedData" \
                  -name "*.app" -type d -path "*iphoneos*" 2>/dev/null | head -1)

          if [ -z "$APP" ]; then
            echo "::error::没有产出 .app"
            grep -E "error:|Error |FAILED|PhaseScriptExecution" "$RUNNER_TEMP/ios-build.log" | head -40
            exit 1
          fi
          echo "找到 .app: $APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: 检查产物
        run: |
          set -euo pipefail
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "版本:      $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "最低系统:  $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "可执行文件: $(file -b "$APP/SalaryTool")"
          if [ -f "$APP/SalaryTool.debug.dylib" ]; then
            echo "::warning::这是 debug 版（含 SalaryTool.debug.dylib），真机启动可能失败"
          else
            echo "Release 版（无 debug dylib）✓"
          fi
          echo "包内文件数: $(find "$APP" -type f | wc -l)"
          du -sh "$APP"

      - name: 打包 ipa
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Payload" ios/out
          mkdir -p "$RUNNER_TEMP/Payload" ios/out
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry -r "$GITHUB_WORKSPACE/ios/out/SalaryTool-unsigned.ipa" Payload)
          ls -lh ios/out/SalaryTool-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SalaryTool-unsigned-ipa
          path: ios/out/SalaryTool-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          retention-days: 7
          if-no-files-found: ignore
