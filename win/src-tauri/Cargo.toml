[package]
name = "salarytool"
version = "0.3.20261117"
description = "当月薪水到手计算器"
authors = ["you"]
edition = "2024"

[lib]
# `_lib` 后缀用于避免 Windows 上 lib 与 bin 同名导致的冲突
name = "salarytool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
